name: Deploy Consolidated Variations to GitHub Pages

on:
  push:
    branches:
      - feat/design-system-panel
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Consolidated App
        env:
          VITE_BASE_PATH: /Jonathan-Farr-Therapy/
        run: npm run build

      - name: Assemble Static SPA Subpaths
        run: |
          mkdir -p _site _site/v1 _site/v2
          cp -r dist/. _site/
          cp _site/index.html _site/404.html
          cp _site/index.html _site/v1/index.html
          cp _site/index.html _site/v2/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
