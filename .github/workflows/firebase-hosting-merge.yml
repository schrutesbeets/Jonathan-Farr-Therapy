name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - v2-meriden-bold
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JONATHAN_FARR_THERAPY_DEMO }}
          channelId: live
          projectId: jonathan-farr-therapy-demo
